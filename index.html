<!doctype html>

    <script>
      (function () {
        if (window.console && typeof window.console.debug === "function") {
          var origDebug = window.console.debug.bind(window.console);
          window.console.debug = function () {
            if (arguments.length > 0 && typeof arguments[0] === "string" && arguments[0].indexOf("[vite]") === 0) {
              return;
            }
            return origDebug.apply(window.console, arguments);
          };
        }
        window.addEventListener("unhandledrejection", function (e) {
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || "";
          if (msg.indexOf("WebSocket closed without opened") !== -1 || msg.indexOf("failed to connect to websocket") !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        var NativeWS = window.WebSocket;
        if (NativeWS) {
          var WrappedWS = function (url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(",") : String(protocols || "");
            if (protoStr.indexOf("vite-hmr") !== -1 || protoStr.indexOf("vite-ping") !== -1) {
              var dummy = {
                url: String(url || ""),
                readyState: 1,
                protocol: protoStr,
                extensions: "",
                bufferedAmount: 0,
                binaryType: "blob",
                send: function () {},
                close: function () {},
                addEventListener: function (type, fn) {
                  if (type === "open" && typeof fn === "function") {
                    setTimeout(function () { try { fn({ type: "open" }); } catch (_) {} }, 0);
                  }
                },
                removeEventListener: function () {},
                dispatchEvent: function () { return true; }
              };
              return dummy;
            }
            return protocols !== undefined ? new NativeWS(url, protocols) : new NativeWS(url);
          };
          WrappedWS.prototype = NativeWS.prototype;
          WrappedWS.CONNECTING = NativeWS.CONNECTING;
          WrappedWS.OPEN = NativeWS.OPEN;
          WrappedWS.CLOSING = NativeWS.CLOSING;
          WrappedWS.CLOSED = NativeWS.CLOSED;
          window.WebSocket = WrappedWS;
        }
      })();
    </script>

    <!-- Dev-only: flush stale service workers + caches BEFORE the app loads so a
         previously-registered worker can't serve an old/broken Vite bundle
         (which causes "dispatcher.useState is null" hook errors). In prod this
         is a no-op, so PWA offline caching is unaffected. -->
    <script>
      // Flush stale service workers + caches in DEV so a previously-registered
      // worker can't keep cache-serving an old/broken Vite bundle (the root cause
      // of "dispatcher.useState is null"). Runs if Vite flags dev OR if the page
      // is detected to be a Vite dev build at runtime (loads /src/main.jsx).
      function flushDevCaches() {
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
          .catch(function () {});
        if (window.caches) {
          caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
        }
      }
      var isDevFlag = "%MODE%" === "development";
      if (isDevFlag) { flushDevCaches(); }
      // Runtime fallback: if this is a Vite dev build (entry is /src/main.jsx),
      // clear as well — covers cases where %MODE% isn't interpolated.
      window.addEventListener("DOMContentLoaded", function () {
        if (isDevFlag) return; // already cleared
        var entry = document.querySelector('script[src="/src/main.jsx"]');
        if (entry) { flushDevCaches(); }
      });
    </script>
