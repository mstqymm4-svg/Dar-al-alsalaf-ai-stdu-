# Build Android APK and AAB
name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ais-pre-taxhi5e3sszvdhq5syo3ia-174510247368.europe-west3.run.app' }}
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID }}
          VITE_BASE44_APP_BASE_URL: ${{ vars.VITE_BASE44_APP_BASE_URL }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Find and setup gradlew
        run: find . -name "gradlew" -exec chmod +x {} \; || true

      - name: Build Debug APK and AAB
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug bundleDebug
          elif [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android && ./gradlew assembleDebug bundleDebug
          else
            gradle assembleDebug bundleDebug
          fi

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app-builds
          path: |
            **/*.apk
            **/*.aab
